name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verification:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      REQUIRE_FRONTEND_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Ruff
        run: python -m ruff check .
      - name: Node and Edge startup
        run: >-
          python -c "import runpy; t = runpy.run_path('tests/test_clustering_frontend_contract.py'); assert t['_run_node_script']('console.log(JSON.stringify({ready: true}))') == {'ready': True}; assert t['_run_browser_script']('document.body.dataset.result = JSON.stringify({ready: true})') == {'ready': True}"
      - name: Frontend contracts (Node and Edge)
        run: python -m pytest tests/test_clustering_frontend_contract.py -ra --junitxml=frontend-results.xml
      - name: Reject skipped frontend checks
        run: >-
          python -c "import xml.etree.ElementTree as ET; tests = ET.parse('frontend-results.xml').findall('.//testcase'); assert tests, 'No frontend tests executed'; assert not any(t.find('skipped') is not None for t in tests), 'Mandatory frontend checks were skipped'"
      - name: Python suite
        run: python -m pytest --ignore=tests/test_clustering_frontend_contract.py -ra
